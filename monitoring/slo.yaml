# Lab 4 — service level objectives.
#
# Most students write a target and stop. The third field is where the thinking is: an SLO
# without a stated response to exhaustion is a wish, not an objective.

service: itcs355-predict

objectives:
  - name: availability
    target: 0.995
    window: 30d
    measurement: "successful responses / total responses, excluding 4xx"
    on_budget_exhausted: |
      Freeze deploys, page the on-call engineer, and fall back to the last known-good model
      if 5xx errors stay above the error budget for two consecutive windows. We do not
      retrain while the service is unhealthy; we stabilize the production path first.

  - name: latency
    target_p95_ms: 200
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    on_budget_exhausted: |
      Page the service owner and reduce or roll back the canary immediately until p95 falls
      back under 200 ms; if the latency increase is systemic, scale the serving tier or
      revert to the previous model build.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    on_budget_exhausted: |
      Trigger a retraining decision only after checking the input data contracts and upstream
      pipelines; a model older than 30 days is a governance signal, not a license to retrain
      on suspect data.
